name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: topup-platform/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: topup-platform/backend/package-lock.json
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: topup-platform/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: topup-platform/web/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          API_URL: https://api.example.com
          NEXT_PUBLIC_TELEGRAM_URL: https://t.me/your_channel
          NEXT_PUBLIC_TELEGRAM_BOT: your_login_bot_username
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ""